name: Probe Coin Metrics On-chain
on:
  workflow_dispatch:
  push:
    branches:
      - probe/coinmetrics-onchain
    paths:
      - .github/workflows/probe-coinmetrics-onchain.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current free BTC metrics
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          base = "https://community-api.coinmetrics.io/v4"
          candidates = ["AdrActCnt","TxCnt","TxTfrCnt","TxTfrValAdjUSD","TxTfrValUSD","SplyCur","SplyAct1d","SplyAct7d","SplyAct30d","SplyAct1yr","SplyAct5yr","SplyAdrBal1in1K","SplyAdrBal1in10K","SplyAdrBal1in100K","SplyAdrBal1in1M","CapRealUSD","NVTAdj","HashRate"]
          def get(path, params):
              url = base + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent":"Victor-Investment-OS/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          cat = get('/catalog-all-v2/asset-metrics', {'assets':'btc','page_size':1000})
          btc = next(x for x in cat['data'] if x['asset']=='btc')
          available = {m['metric']:m for m in btc['metrics']}
          selected = [m for m in candidates if m in available]
          print("CATALOG_SELECTED", ",".join(selected))
          for metric in selected:
              try:
                  d=get('/timeseries/asset-metrics', {'assets':'btc','metrics':metric,'frequency':'1d','page_size':5,'paging_from':'end'})
                  rows=d.get('data',[])
                  last=rows[-1] if rows else {}
                  print("METRIC",metric,"LATEST",last.get("time"),"VALUE",last.get(metric),"ROWS",len(rows))
              except Exception as e:
                  print("METRIC_FAIL",metric,type(e).__name__,str(e)[:200])