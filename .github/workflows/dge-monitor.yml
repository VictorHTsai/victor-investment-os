name: DGE Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Generate live DGE snapshot
        run: python scripts/publish_dge_snapshot.py
      - name: Commit snapshot when changed
        run: |
          git config user.name "victor-investment-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/dge-dashboard/data/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh DGE BTC snapshot"
          git push
