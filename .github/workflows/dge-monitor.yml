name: DGE Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dge-monitor-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .

      - name: Generate live DGE snapshot
        run: python scripts/publish_dge_snapshot.py

      - name: Commit snapshot when changed
        run: |
          git config user.name "victor-investment-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/dge-dashboard/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh DGE BTC snapshot"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload DGE dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dge-dashboard

      - name: Deploy DGE dashboard
        id: deployment
        uses: actions/deploy-pages@v4
