name: Deploy DGE Dashboard to Pages

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "apps/dge-dashboard/**"
      - "scripts/publish_btc_cycle_snapshot.py"\n      - "scripts/publish_btc_market_intelligence.py"
      - ".github/workflows/dge-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate BTC cycle snapshot
        run: python scripts/publish_btc_cycle_snapshot.py

      - name: Generate BTC market intelligence snapshot\n        run: python scripts/publish_btc_market_intelligence.py\n\n      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dge-dashboard

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
